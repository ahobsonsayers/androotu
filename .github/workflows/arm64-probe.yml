name: arm64-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          uname -m
          sw_vers
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head -20 || echo "no ANDROID_HOME"
          df -h / | tail -1

      - name: Install emulator + arm64 system image
        run: |
          set -e
          # macOS runners ship cmdline-tools in ANDROID_HOME
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/ct.zip "https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip"
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$SDKM" --licenses > /tmp/licenses.log 2>&1 || true
          "$SDKM" --install "platform-tools" "system-images;android-36;google_apis_playstore;arm64-v8a" 2>&1 | tee /tmp/sdk-install.log | tail -3
          ls "$ANDROID_HOME/system-images/android-36/google_apis_playstore/arm64-v8a/"

      - name: Create AVD
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n probe -k "system-images;android-36;google_apis_playstore;arm64-v8a" -d pixel_6 --force
          # remove skin lines (may not exist) and cap RAM
          sed -i '' '/^skin\./d' "$HOME/.android/avd/probe.avd/config.ini" 2>/dev/null || true
          echo "hw.ramSize=4096" >> "$HOME/.android/avd/probe.avd/config.ini"
          grep -E "abi|ramSize|hw.cpu" "$HOME/.android/avd/probe.avd/config.ini" | head -5

      - name: Boot emulator (Apple Silicon HVF)
        run: |
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          nohup "$ANDROID_HOME/emulator/emulator" -avd probe \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -no-metrics -gpu swiftshader_indirect \
            > /tmp/emulator.log 2>&1 &
          echo "emulator launched pid $!"
          BOOTED=""
          for i in $(seq 1 240); do
            adb wait-for-device > /dev/null 2>&1 || true
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$B" = "1" ]; then BOOTED="yes"; break; fi
            if ! pgrep -f qemu-system > /dev/null; then
              echo "EMULATOR DIED at poll $i"
              break
            fi
            sleep 15
          done
          echo "BOOTED=$BOOTED"
          if [ -n "$BOOTED" ]; then
            echo "=== boot props ==="
            adb shell getprop ro.build.fingerprint
            adb shell getprop ro.product.cpu.abilist
            adb shell getprop ro.build.version.sdk
            adb shell getprop sys.boot_completed
            adb shell uptime
          else
            echo "=== emulator log tail ==="
            tail -50 /tmp/emulator.log
            exit 1
          fi

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: /tmp/emulator.log

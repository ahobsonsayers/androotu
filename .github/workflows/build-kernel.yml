name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kernel/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm dwarves ccache bc bison flex \
            libssl-dev libelf-dev kmod cpio rsync \
            python3 device-tree-compiler zstd lz4
          clang --version | head -1
          ld.lld --version | head -1

      - name: Build kernel
        run: |
          cd kernel
          ./build/build-all.sh
          ls -la dist/bzImage

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=kernel-latest
          # delete any previous rolling release + tag
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            kernel/dist/bzImage \
            --title "Kernel (rolling)" \
            --notes "Rolling build of the KSU-Next + SUSFS kernel (bzImage-a36-btf). Rebuilt on every push to kernel/ or manual dispatch."

  # Build + push the kernel-builder image so CI and the emulator image's
  # multi-stage build reuse a cached toolchain.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push kernel-builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kernel/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-kernel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

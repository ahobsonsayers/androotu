name: build-kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kernel-build/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm dwarves ccache bc bison flex \
            libssl-dev libelf-dev kmod cpio rsync \
            python3 device-tree-compiler zstd lz4
          clang --version | head -1
          ld.lld --version | head -1

      - name: Build kernel
        run: |
          cd kernel-build
          ./scripts/build-all.sh
          ls -la out/bzImage

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=kernel-latest
          # delete any previous rolling release + tag
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            kernel-build/out/bzImage \
            --title "Kernel (rolling)" \
            --notes "Rolling build of the KSU-Next + SUSFS kernel (bzImage-a36-btf). Rebuilt on every push to kernel-build/ or manual dispatch."

version: '3'

vars:
  ANDROID_HOME:
    sh: 'echo "${ANDROID_HOME:-$HOME/Android/Sdk}"'
  AVD_NAME: rooted33
  SERIAL: emulator-5554
  EMULATOR_RAM: "1536"

tasks:
  # ─── Install (one-time setup) ────────────────────────────────────────────

  install:native:
    desc: One-time native setup — install SDK, create AVD, clone rootAVD
    cmds:
      - scripts/01-setup-sdk.sh
      - scripts/02-create-avd.sh
      - scripts/03-clone-rootavd.sh

  install:docker:
    desc: One-time Docker setup — build the emulator image
    cmds:
      - docker compose -f docker/docker-compose.yml build

  # ─── Run (boot + root + verify) ───────────────────────────────────────────

  run:native:
    desc: Run full root flow natively — patch ramdisk, cold boot, setup Magisk, verify
    cmds:
      - scripts/04-root-avd.sh
      - scripts/05-boot-emulator.sh
      - scripts/06-setup-magisk.sh
      - scripts/07-verify-root.sh

  run:docker:
    desc: Run full root flow in Docker (container boots, patches, sets up Magisk)
    cmds:
      - docker compose -f docker/docker-compose.yml up -d
      - 'echo "Container started. Tail logs: task docker:logs  |  Verify: task docker:verify"'

  # ─── Individual steps (callable directly) ─────────────────────────────────

  step:1-setup-sdk:
    desc: Install Android SDK + API 33 Play Store image
    cmds:
      - scripts/01-setup-sdk.sh

  step:2-create-avd:
    desc: Create AVD rooted33 (pixel_6, 1536MB RAM, headless config)
    cmds:
      - scripts/02-create-avd.sh

  step:3-clone-rootavd:
    desc: Clone rootAVD repo (Magisk patcher for AVDs)
    cmds:
      - scripts/03-clone-rootavd.sh

  step:4-root:
    desc: Boot unrooted (wipe), patch ramdisk with Magisk via rootAVD
    cmds:
      - scripts/04-root-avd.sh

  step:5-boot:
    desc: Boot emulator headless. Use WIPE_DATA=1 for clean first boot.
    cmds:
      - scripts/05-boot-emulator.sh

  step:6-setup-magisk:
    desc: Complete Magisk Direct Install + grant shell su (UI automation)
    cmds:
      - scripts/06-setup-magisk.sh

  step:7-verify:
    desc: Check root access, Magisk version, Play Store + GMS
    cmds:
      - scripts/07-verify-root.sh

  # ─── Docker helpers ──────────────────────────────────────────────────────

  docker:down:
    desc: Stop Docker container
    cmds:
      - docker compose -f docker/docker-compose.yml down

  docker:logs:
    desc: Tail emulator logs from Docker container
    cmds:
      - docker compose -f docker/docker-compose.yml logs -f

  docker:adb:
    desc: Open adb shell in Docker container
    cmds:
      - docker compose -f docker/docker-compose.yml exec emulator adb shell

  docker:verify:
    desc: Verify root inside running Docker container
    cmds:
      - docker compose -f docker/docker-compose.yml exec emulator /opt/scripts/06-setup-magisk.sh

  # ─── Cleanup ─────────────────────────────────────────────────────────────

  clean:native:
    desc: Remove AVD + rootAVD clone (keeps SDK). Requires confirmation.
    prompts:
      - This deletes ~/.android/avd/rooted33.avd and ~/rootAVD. Continue?
    cmds:
      - rm -rf ~/.android/avd/rooted33.avd ~/.android/avd/rooted33.ini
      - rm -rf "${ROOTAVD_DIR:-$HOME/rootAVD}"
      - 'echo "Native state cleaned (SDK kept at $ANDROID_HOME)."'

  clean:docker:
    desc: Remove Docker image + volume. Requires confirmation.
    prompts:
      - This removes the docker-emulator image and avd-data volume. Continue?
    cmds:
      - docker compose -f docker/docker-compose.yml down -v --rmi local
      - 'echo "Docker state cleaned."'
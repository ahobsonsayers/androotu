version: '3'

vars:
  ANDROID_HOME:
    sh: 'echo "${ANDROID_HOME:-$HOME/Android/Sdk}"'
  AVD_NAME: a36
  SERIAL: emulator-5554

tasks:
  # ─── Install (one-time setup) ────────────────────────────────────────────

  install:
    desc: One-time setup — create the a36 AVD
    cmds:
      - avd/scripts/01-create-avd.sh

  # ─── Run (full integrity stack) ─────────────────────────────────────────

  run:
    desc: Full flow — create AVD, boot, install modules, configure, verify
    cmds:
      - task: install
      - task: boot
      - task: install:modules
      - task: configure
      - task: verify

  boot:
    desc: Boot the a36 emulator headless with the custom kernel
    cmds:
      - avd/scripts/02-boot-emulator.sh

  install:modules:
    desc: Install Integrity Box + WebUI/manager apps, then reboot
    cmds:
      - avd/scripts/03-install-modules.sh

  configure:
    desc: Configure Integrity Box (Supreme profile + toggles) and restart GMS
    cmds:
      - avd/scripts/04-configure.sh

  verify:
    desc: Check the stack + TEESimulator GENERATE mode
    cmds:
      - avd/scripts/05-verify-integrity.sh

  # ─── Lint ────────────────────────────────────────────────────────────────

  lint:
    desc: Format (shfmt -i 2) and shellcheck all scripts
    cmds:
      - shfmt -i 2 -w avd/scripts/*.sh kernel/build/*.sh docker/scripts/*.sh
      - shellcheck -x avd/scripts/*.sh kernel/build/*.sh docker/scripts/*.sh
      - bash -n avd/scripts/*.sh kernel/build/*.sh docker/scripts/*.sh

  # ─── Cleanup ─────────────────────────────────────────────────────────────

  clean:
    desc: Remove the a36 AVD. Requires confirmation.
    prompts:
      - This deletes ~/.android/avd/a36.avd. Continue?
    cmds:
      - rm -rf ~/.android/avd/a36.avd ~/.android/avd/a36.ini
      - 'echo "a36 AVD cleaned."'
